name: Deploy Backend to Production

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to cPanel Shared Hosting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Save private key
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key

          # Note: SSH_PRIVATE_KEY contains the full private key content
          chmod 600 ~/.ssh/deploy_key

          # Detect SSH port (default 22 if not specified)
          SSH_PORT="${{ secrets.SSH_PORT }}"
          SSH_PORT=${SSH_PORT:-22}

          # Add host to known_hosts
          ssh-keyscan -p $SSH_PORT -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

          # Create SSH config
          cat > ~/.ssh/config << SSHCONFIG
          Host deploy-server
            HostName ${{ secrets.SSH_HOST }}
            Port $SSH_PORT
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking=accept-new
            ConnectTimeout=10
          SSHCONFIG
          chmod 600 ~/.ssh/config

      - name: Deploy via SSH
        run: |
          ssh deploy-server << DEPLOY
          set -e

          # Navigate to project directory
          cd ${{ secrets.SSH_PROJECT_PATH }}/backend

          echo "=== Starting Deploy ==="
          echo "Server: $(hostname)"
          echo "Branch: main"
          echo "Date: $(date)"

          # Backup .env if exists
          if [ -f .env ]; then
            cp .env .env.backup.$(date +%s)
            echo "✓ .env backed up"
          fi

          # Pull latest code
          echo ""
          echo "=== Pulling code ==="
          git fetch origin main
          git checkout origin/main
          echo "✓ Code updated"

          # Install dependencies
          echo ""
          echo "=== Installing dependencies ==="
          ea-php83 /usr/local/bin/composer install --no-dev --prefer-dist --no-interaction
          echo "✓ Dependencies installed"

          # Clear configuration cache
          echo ""
          echo "=== Clearing configuration ==="
          ea-php83 artisan config:clear
          echo "✓ Configuration cleared"

          # Run migrations
          echo ""
          echo "=== Running migrations ==="
          ea-php83 artisan migrate --force --no-interaction
          echo "✓ Migrations completed"

          # Cache optimization
          echo ""
          echo "=== Caching configuration ==="
          ea-php83 artisan config:cache
          ea-php83 artisan route:cache
          echo "✓ Cache updated"

          # Set permissions
          echo ""
          echo "=== Setting permissions ==="
          chmod -R 775 storage bootstrap/cache
          echo "✓ Permissions set"

          echo ""
          echo "✅ Deployment completed successfully"
          echo "=== End Deploy ==="
          DEPLOY

      - name: Cleanup SSH
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
          rm -f ~/.ssh/config
          rm -f ~/.ssh/known_hosts
